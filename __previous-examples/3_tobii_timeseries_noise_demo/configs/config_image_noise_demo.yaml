dataset:
  image:
    bbox_model: grid
    path: datasets/image_noise_demo

display:
  monitor:
    name: spectrum_monitor
    resolution:
      - 2560
      - 1440
    width: 35
    distance: 60
    display_number: 0

  gui:
    button:
      size:
        - 250
        - 100
      margin: 20
      color: lightgrey
      text:
        color: black
        size: 30

    fixation_dot:
      size: 10
      color: white

    aoe:
      - 1600
      - 800

output:
  folder: output/image_noise_demo

instructions:
  intro:
    - "Time-Series Variability Classification"
    - ""
    - "You will see plots from two signal domains:"
    - "machine vibration and photovoltaic power production."
    - ""
    - "For MACHINE VIBRATION, judge the magnitude of irregular vibration fluctuations."
    - "For PV POWER, judge the magnitude of short-term power fluctuations."
    - "Use the y-axis label to identify the signal domain."
    - ""
    - "Select LOW, MEDIUM, HIGH, or NIE WIEM."
    - ""
    - "Click the window and press SPACE to begin."

  outro:
    - "End of experiment."
    - ""
    - "Thank you for participating."
    - "Your responses and eye-tracking data have been saved."
    - "Press ESC to exit."
