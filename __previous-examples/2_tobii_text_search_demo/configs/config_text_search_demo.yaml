dataset:
  text:
    label_column_name: answer
    text_column_name: selected_text
    color: white
    background_color: black
    bbox_model: word
    font_height: 35
    wrap_fraction: 0.95
    path: datasets/text_search_demo.csv

display:
  monitor:
    name: spectrum_monitor
    resolution:
      - 2560
      - 1440
    width: 35
    distance: 60
    display_number: 0
  gui:
    button:
      size:
        - 250
        - 100
      margin: 20
      color: lightgrey
      text:
        color: black
        size: 30
    fixation_dot:
      size: 10
      color: white
    aoe:
      - 1200
      - 750

output:
  folder: output/text_search_demo

instructions:
  intro:
    - "Wyszukiwanie informacji w tek\u015bcie"
    - ""
    - "Przeczytaj pytanie i znajd\u017a potrzebn\u0105 informacj\u0119 w tek\u015bcie."
    - "Nast\u0119pnie wybierz odpowied\u017a TAK, NIE albo NIE WIEM."
    - "Czytaj i odpowiadaj w naturalnym tempie."
    - ""
    - "Kliknij okno i naci\u015bnij SPACE, aby rozpocz\u0105\u0107."
  outro:
    - "Koniec eksperymentu."
    - ""
    - "Dzi\u0119kujemy za udzia\u0142."
    - "Wyniki zosta\u0142y zapisane."
    - "Naci\u015bnij ESC, aby zako\u0144czy\u0107."
