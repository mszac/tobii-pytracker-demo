dataset:
  text:
    label_column_name: answer
    text_column_name: selected_text
    color: white
    background_color: black
    bbox_model: word
    path: datasets/ux_ab_demo.csv

display:
  monitor:
    name: spectrum_monitor
    resolution:
      - 2560
      - 1440
    width: 35
    distance: 60
    display_number: 0
  gui:
    button:
      size:
        - 250
        - 100
      margin: 20
      color: lightgrey
      text:
        color: black
        size: 30
    fixation_dot:
      size: 10
      color: white
    aoe:
      - 750
      - 750

output:
  folder: output/ux_ab_demo

