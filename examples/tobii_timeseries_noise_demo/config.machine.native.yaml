dataset:
  time_series:
    label_column_name: class
    bbox_model: sample
    path: examples/tobii_timeseries_noise_demo/data/machine_vibration.csv

display:
  monitor:
    name: timeseries_machine_monitor
    resolution:
      - 1920
      - 1080
    width: 35
    distance: 60
    display_number: 0
  gui:
    button:
      size:
        - 250
        - 100
      margin: 20
      color: lightgrey
      text:
        color: black
        size: 30
    fixation_dot:
      size: 10
      color: white
    aoe:
      - 1600
      - 800

output:
  folder: output/tobii_timeseries_noise_demo/machine

instructions:
  intro:
    - "TIME-SERIES VARIABILITY DEMO — MACHINE VIBRATION"
    - "Judge how large the irregular vibration fluctuations are."
    - "Choose LOW, MEDIUM or HIGH. NONE means you are unsure."
    - "There is no response timer: the current stimulus remains visible until you click an answer."
    - "For MouseGaze: hold RIGHT mouse button while moving to generate gaze samples."
    - "Release RIGHT before LEFT CLICK because LEFT+RIGHT is used as blink by upstream MouseGaze."
    - "Click the window and press SPACE to begin."
  outro:
    - "Machine-vibration block complete."
    - "The data have been saved."
    - "Press ESC to continue to the PV block."
