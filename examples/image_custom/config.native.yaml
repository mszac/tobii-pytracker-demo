dataset:
  image:
    bbox_model: grid
    path: examples/image_custom/data/pix
display:
  monitor:
    name: image_custom_monitor
    resolution:
    - 1920
    - 1080
    width: 35
    distance: 60
    display_number: 0
  gui:
    button:
      size:
      - 260
      - 100
      margin: 20
      color: lightgrey
      text:
        color: black
        size: 30
    fixation_dot:
      size: 10
      color: white
    aoe:
    - 900
    - 700
output:
  folder: output/image_custom
