dataset:
  text:
    path: examples/tobii_text_search_demo/data/text_search.csv
    label_column_name: answer
    text_column_name: selected_text
    bbox_model: word
    font_height: 32
    wrap_fraction: 0.92

display:
  monitor:
    name: text_search_demo_monitor
    resolution:
      - 1920
      - 1080
    width: 53
    distance: 60
    display_number: 0
  gui:
    button:
      size:
        - 250
        - 100
      margin: 20
      color: lightgrey
      text:
        color: black
        size: 30
    fixation_dot:
      size: 10
      color: white
    aoe:
      - 1200
      - 700

output:
  folder: output/tobii_text_search_demo

instructions:
  intro:
    - "TEXT SEARCH DEMO"
    - "Read the question and short information text."
    - "Find the answer-relevant phrase, then choose TAK or NIE."
    - "The upstream TextDataset also adds NONE; in this demo NONE means NIE WIEM."
    - "For MouseGaze: hold RIGHT mouse button while moving the pointer to generate gaze samples."
    - "Release RIGHT before LEFT CLICK because LEFT+RIGHT is used as blink by upstream MouseGaze."
    - "Click the window and press SPACE to begin."
  outro:
    - "The 12-trial text-search demo is complete."
    - "The output has been saved."
    - "Press ESC to exit."
