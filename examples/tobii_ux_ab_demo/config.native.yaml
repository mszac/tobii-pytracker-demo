dataset:
  text:
    path: examples/tobii_ux_ab_demo/data/text_search.csv
    label_column_name: answer
    text_column_name: text
    font_height: 32
    wrap_fraction: 0.92

display:
  monitor:
    name: ux_ab_demo_monitor
    resolution:
      - 1920
      - 1080
    width: 53
    distance: 60
    display_number: 0
  gui:
    button:
      size:
        - 250
        - 100
      margin: 20
      color: lightgrey
      text:
        color: black
        size: 30
    fixation_dot:
      size: 10
      color: white
    aoe:
      - 1200
      - 700

output:
  folder: output/tobii_ux_ab_demo

instructions:
  intro:
    - "UX INFORMATION-PLACEMENT DEMO"
    - "Read each short question and interface-style text, then choose TAK or NIE."
    - "The answer-relevant phrase appears either early or late in the text."
    - "There is no response timer: the current stimulus remains visible until you click an answer."
    - "For MouseGaze: hold RIGHT mouse button while moving the pointer to generate gaze samples."
    - "Release RIGHT before LEFT CLICK because LEFT+RIGHT is used as blink by upstream MouseGaze."
    - "A third NONE button is added by the current upstream TextDataset; do not use it in this demo."
    - "Click the window and press SPACE to begin."
  outro:
    - "The 12-trial UX A/B demo is complete."
    - "The output has been saved."
    - "Press ESC to exit."
